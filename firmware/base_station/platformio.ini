[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  sandeepmistry/LoRa@0.8.0
build_flags =
  -Wall
  -Wextra
  -DESP32

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_filters = time
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  sandeepmistry/LoRa@0.8.0
build_flags =
  -Wall
  -Wextra
  -DESP8266
