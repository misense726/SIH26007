name: fogsen

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FOGSEN_CONFIG_DIR: /app/config
      FOGSEN_HOST: 0.0.0.0
      FOGSEN_PORT: "8000"
      FOGSEN_TELEMETRY_HZ: "10"
      FOGSEN_MODE: "${FOGSEN_MODE:-SIMULATED}"
      FOGSEN_TELEMETRY_TRANSPORT: "${FOGSEN_TELEMETRY_TRANSPORT:-WIFI}"
      FOGSEN_WIFI_LISTEN_HOST: "0.0.0.0"
      FOGSEN_WIFI_LISTEN_PORT: "${FOGSEN_WIFI_LISTEN_PORT:-8765}"
      FOGSEN_CAMERA_STREAM_URL: "${FOGSEN_CAMERA_STREAM_URL:-tcp://misense.local:8888}"
      FOGSEN_CAMERA_STALE_MS: "${FOGSEN_CAMERA_STALE_MS:-1500}"
      FOGSEN_CAMERA_RECONNECT_MS: "${FOGSEN_CAMERA_RECONNECT_MS:-1000}"
      FOGSEN_CAMERA_OPEN_TIMEOUT_MS: "${FOGSEN_CAMERA_OPEN_TIMEOUT_MS:-15000}"
      FOGSEN_CAMERA_READ_TIMEOUT_MS: "${FOGSEN_CAMERA_READ_TIMEOUT_MS:-5000}"
      FOGSEN_CAMERA_JPEG_QUALITY: "${FOGSEN_CAMERA_JPEG_QUALITY:-88}"
      FOGSEN_CAMERA_DEHAZE_ENABLED: "${FOGSEN_CAMERA_DEHAZE_ENABLED:-true}"
      FOGSEN_CAMERA_DEHAZE_MODEL_ROOT: /opt/fogsen-model
      FOGSEN_CAMERA_DEHAZE_DEVICE: "${FOGSEN_CAMERA_DEHAZE_DEVICE:-cuda}"
      FOGSEN_CAMERA_DEHAZE_FP16: "${FOGSEN_CAMERA_DEHAZE_FP16:-true}"
      FOGSEN_CAMERA_DEHAZE_MAX_FPS: "${FOGSEN_CAMERA_DEHAZE_MAX_FPS:-30}"
      FOGSEN_SENSOR_SETTINGS_PATH: /app/runtime/sensor_display.json
    gpus: all
    ports:
      - "8000:8000"
      - "8765:8765"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - fogsen-runtime:/app/runtime

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --quiet --output-document=/dev/null http://127.0.0.1/healthz || exit 1"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  fogsen-runtime:
