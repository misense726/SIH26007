name: fogsen

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FOGSEN_CONFIG_DIR: /app/config
      FOGSEN_HOST: 0.0.0.0
      FOGSEN_PORT: "8000"
      FOGSEN_TELEMETRY_HZ: "10"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --quiet --output-document=/dev/null http://127.0.0.1/healthz || exit 1"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

