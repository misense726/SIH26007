acquisition:
  stagger_ms: 8
  sequence:
    - front_left
    - front_right
    - left_side
    - right_side
    - front_scanner
    - rear_scanner

sensors:
  front_scanner:
    type: VL53L1X
    position_m: [0.0, 0.5]
    orientation_deg: 0.0
    servo_min_deg: -80.0
    servo_max_deg: 80.0
    servo_center_deg: 0.0
    range_offset_m: 0.0
    max_range_m: 4.0
  rear_scanner:
    type: VL53L1X
    position_m: [0.0, -0.5]
    orientation_deg: 180.0
    servo_min_deg: -80.0
    servo_max_deg: 80.0
    servo_center_deg: 0.0
    range_offset_m: 0.0
    max_range_m: 4.0
  front_left:
    type: VL53L0X
    position_m: [-0.26, 0.48]
    orientation_deg: -25.0
    range_offset_m: 0.0
    max_range_m: 2.0
  front_right:
    type: VL53L0X
    position_m: [0.26, 0.48]
    orientation_deg: 25.0
    range_offset_m: 0.0
    max_range_m: 2.0
  left_side:
    type: VL53L0X
    position_m: [-0.32, 0.0]
    orientation_deg: -90.0
    range_offset_m: 0.0
    max_range_m: 2.0
  right_side:
    type: VL53L0X
    position_m: [0.32, 0.0]
    orientation_deg: 90.0
    range_offset_m: 0.0
    max_range_m: 2.0

localization:
  aruco_vehicle_offset_m: [0.0, 0.0]
  aruco_heading_offset_deg: 0.0
  imu_heading_offset_deg: 0.0

environment:
  bmp280_startup_baseline: true
  altitude_label: approximate_relative

