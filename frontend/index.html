<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0d12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (() => {
        let savedTheme = null;
        try {
          savedTheme = window.localStorage.getItem("fogsen-theme");
        } catch {
          // Use the system preference when storage is unavailable.
        }
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0a0d12" : "#f4f6f8";
      })();
    </script>
    <meta
      name="description"
      content="MI Sense vehicle awareness and fleet operations dashboard"
    />
    <meta property="og:title" content="MI Sense" />
    <meta property="og:description" content="Vehicle awareness and fleet operations dashboard" />
    <meta property="og:type" content="website" />
    <title>MI Sense | Choose console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
